name: Release

# Builds the signed app bundle on macOS and publishes it as a GitHub Release
# when main carries an app version that has no release yet (or when a matching
# version tag is pushed). The release creates the vX.Y.Z tag on that commit.
# The in-app Check for Updates reads the latest stable release created here.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether this version needs a release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n '/CFBundleShortVersionString/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' Scripts/package-app.zsh)
          tag="v$version"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA is not on main"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version $version"; exit 1
          fi
          grep -q "^## $version " CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Run Swift tests
        if: steps.plan.outputs.publish == 'true'
        run: swift test

      - name: Package the app
        if: steps.plan.outputs.publish == 'true'
        run: zsh Scripts/package-app.zsh "$RUNNER_TEMP/AsteraDMXMidiBridge.zip"

      - name: Publish the release
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          version: ${{ steps.plan.outputs.version }}
          tag: ${{ steps.plan.outputs.tag }}
        run: |
          awk -v v="$version" '$0 ~ "^## " v " " {on=1; next} /^## / {on=0} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          {
            echo
            echo "Download \`AsteraDMXMidiBridge.zip\`, unzip it, quit the running app and replace your copy. Requires an Apple silicon Mac with macOS 13 or later. Your fixture patch and MIDI settings carry over."
          } >> "$RUNNER_TEMP/notes.md"
          gh release create "$tag" "$RUNNER_TEMP/AsteraDMXMidiBridge.zip" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "AsteraDMXMidiBridge $version" --notes-file "$RUNNER_TEMP/notes.md"
